name: Build APK from ZIP

# 저장소 루트에 zip 파일을 그대로 올리면(push) 자동으로 압축을 풀고 APK를 빌드합니다.
on:
  push:
    branches: [main, master]
    paths:
      - "*.zip"
      - ".github/workflows/build-apk-from-zip.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          set -e
          ZIP=$(ls -t *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "::error::저장소 루트에 zip 파일이 없습니다."
            exit 1
          fi
          echo "Using: $ZIP"
          rm -rf project && mkdir project
          unzip -q "$ZIP" -d project

          # zip 안에 폴더가 한 겹 더 있는 경우(project/폴더명/...) 자동으로 올려줌
          if [ ! -f project/settings.gradle.kts ] && [ ! -f project/settings.gradle ]; then
            INNER=$(dirname "$(find project -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)")
            if [ -z "$INNER" ] || [ "$INNER" = "." ]; then
              echo "::error::zip 안에서 settings.gradle(.kts)를 찾지 못했습니다."
              exit 1
            fi
            mv "$INNER" project_inner
            rm -rf project
            mv project_inner project
          fi
          ls -la project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: evergreen-debug-apk
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # R8 최적화된 릴리스 APK (실패해도 디버그 APK에는 영향 없음)
      - name: Build release APK
        id: release
        continue-on-error: true
        working-directory: project
        run: gradle assembleRelease --stacktrace

      - name: Upload release APK
        if: steps.release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: evergreen-release-apk
          path: project/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
