
name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Copy APK to root
        run: |
          find . -type f -path "*/build/outputs/apk/*/*.apk" \
            -exec cp {} ./Evergreen.apk \;
          test -f ./Evergreen.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Evergreen-APK
          path: Evergreen.apk
          if-no-files-found: error
