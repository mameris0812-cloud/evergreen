name: Build APK from ZIP

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**/*.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Extract ZIP and build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t zip_files < <(
            find "$GITHUB_WORKSPACE" -type f -iname '*.zip' -not -path '*/.git/*' | sort
          )

          if [[ ${#zip_files[@]} -eq 0 ]]; then
            echo "::error::저장소에서 프로젝트 ZIP 파일을 찾지 못했습니다. ZIP을 저장소에 업로드해 주세요."
            exit 1
          fi

          if [[ ${#zip_files[@]} -gt 1 ]]; then
            echo "::error::ZIP 파일이 여러 개 발견됐습니다. 빌드할 ZIP 하나만 저장소에 남겨 주세요."
            printf '%s\n' "${zip_files[@]}"
            exit 1
          fi

          archive="${zip_files[0]}"
          source_dir="$GITHUB_WORKSPACE/_source"

          echo "압축 파일: $archive"
          rm -rf "$source_dir"
          mkdir -p "$source_dir"
          unzip -q "$archive" -d "$source_dir"

          # ZIP 안에서 Android Gradle 프로젝트 위치를 자동으로 찾습니다.
          mapfile -t settings_files < <(
            find "$source_dir" -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              -not -path '*/.gradle/*' | sort
          )

          project_dir=""
          for settings_file in "${settings_files[@]}"; do
            candidate="$(dirname "$settings_file")"
            if [[ -f "$candidate/app/build.gradle" || -f "$candidate/app/build.gradle.kts" ]]; then
              project_dir="$candidate"
              break
            fi
          done

          if [[ -z "$project_dir" ]]; then
            echo "::error::ZIP 안에서 app 모듈이 있는 Android Gradle 프로젝트를 찾지 못했습니다."
            exit 1
          fi

          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "프로젝트 위치: $project_dir"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 34
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/output/evergreen-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: output/evergreen-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 14
