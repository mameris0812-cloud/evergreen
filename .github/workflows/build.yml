name: Build APK (from zip)

# 저장소에 zip 파일을 그대로 올리면, 자동으로 압축을 풀고 APK를 빌드합니다.
# - zip 파일은 저장소 최상위(루트)에 두세요. (예: evergreen_github.zip)
# - zip이 여러 개면 이름순으로 마지막 파일을 사용합니다.
# - 수동 실행 시 zip 파일 이름을 직접 지정할 수 있습니다.

on:
  push:
    branches: [main, master]
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
    inputs:
      zip_name:
        description: "빌드할 zip 파일 이름 (비워두면 자동 선택)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and unzip project
        id: unzip
        run: |
          set -e
          ZIP="${{ github.event.inputs.zip_name }}"
          if [ -z "$ZIP" ]; then
            ZIP="$(ls -1 *.zip 2>/dev/null | sort | tail -n 1)"
          fi
          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "::error::저장소 루트에서 zip 파일을 찾을 수 없습니다."
            exit 1
          fi
          echo "사용할 zip: $ZIP"

          rm -rf _src
          mkdir _src
          unzip -q "$ZIP" -d _src

          # zip 안에 폴더가 한 겹 더 있어도 settings.gradle(.kts) 위치를 찾아서 사용
          SETTINGS="$(find _src -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::zip 안에서 settings.gradle(.kts)를 찾을 수 없습니다."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "프로젝트 폴더: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ steps.unzip.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Evergreen-debug-apk
          path: ${{ steps.unzip.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
