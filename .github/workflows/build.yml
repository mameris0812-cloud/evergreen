name: Build APK from ZIP

on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip newest zip
        run: |
          ZIP=$(ls *.zip 2>/dev/null | sort -V | tail -1)
          [ -n "$ZIP" ] || { echo "저장소 루트에 zip 파일이 없습니다"; exit 1; }
          echo "사용할 zip: $ZIP"
          mkdir -p /tmp/src
          unzip -q -o "$ZIP" -d /tmp/src
          # (여러 zip 이 있으면 이름의 버전 번호가 가장 큰 것) zip 안에 바깥 폴더가 한 겹 더 있어도 찾아낸다
          ROOT=$(dirname "$(find /tmp/src -maxdepth 3 -name settings.gradle.kts | head -1)")
          [ -n "$ROOT" ] || { echo "settings.gradle.kts 를 못 찾음"; exit 1; }
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Build release APK
        id: release
        continue-on-error: true
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleRelease --stacktrace

      # APK 를 폴더 없이 한 곳에 평평하게 모은다
      - name: Collect APKs (flat)
        run: |
          mkdir -p /tmp/out
          cp "$PROJECT_DIR"/app/build/outputs/apk/debug/*.apk /tmp/out/evergreen-debug.apk
          if [ "${{ steps.release.outcome }}" = "success" ]; then
            cp "$PROJECT_DIR"/app/build/outputs/apk/release/*.apk /tmp/out/evergreen-release.apk
          fi
          ls -l /tmp/out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: evergreen-apk
          path: /tmp/out/*.apk
          if-no-files-found: error

      # 릴리스에 APK 를 직접 붙인다 (zip 압축 없이 바로 다운로드)
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: /tmp/out/*.apk
