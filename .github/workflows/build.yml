name: Build APK from ZIP

on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 어떤 zip 이 가장 최근에 올라왔는지 git 기록으로 찾기 위해 전체 기록을 받는다

      - name: Unzip newest zip
        run: |
          # 가장 최근에 올리거나 바꾼 zip (git 기록 기준). 이름은 상관없다.
          ZIP=$(git log -1 --diff-filter=AM --name-only --format= -- '*.zip' | head -1)
          # 혹시 못 찾으면(기록 없음) 이름 순으로 가장 큰 것
          [ -n "$ZIP" ] || ZIP=$(ls *.zip 2>/dev/null | sort -V | tail -1)
          [ -n "$ZIP" ] || { echo "저장소 루트에 zip 파일이 없습니다"; exit 1; }
          echo "사용할 zip: $ZIP"
          echo "ZIP_FILE=$ZIP" >> "$GITHUB_ENV"   # 맨 마지막 '올린 zip 정리' 단계에서 쓴다
          mkdir -p /tmp/src
          unzip -q -o "$ZIP" -d /tmp/src
          # zip 안에 바깥 폴더가 한 겹 더 있어도 찾아낸다
          FOUND=$(find /tmp/src -maxdepth 3 -name settings.gradle.kts | head -1)
          [ -n "$FOUND" ] || { echo "settings.gradle.kts 를 못 찾음"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$FOUND")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleRelease --stacktrace

      # APK 를 폴더 없이 한 곳에 평평하게 모은다
      - name: Collect APK (flat)
        run: |
          mkdir -p /tmp/out
          cp "$PROJECT_DIR"/app/build/outputs/apk/release/*.apk /tmp/out/evergreen-release.apk
          ls -l /tmp/out

      # 앱 안 업데이트와 Obtainium 이 '새 버전인지' 판단하도록, 빌드한 앱의 버전 번호를 읽어 릴리스 설명에 적는다
      - name: Read app version
        id: ver
        run: |
          GRADLE_FILE="$PROJECT_DIR/app/build.gradle.kts"
          VC=$(grep -oP 'versionCode = \K[0-9]+' "$GRADLE_FILE" | head -1)
          VN=$(grep -oP 'versionName = "\K[^"]+' "$GRADLE_FILE" | head -1)
          echo "versionCode=$VC / versionName=$VN"
          echo "vc=$VC" >> "$GITHUB_OUTPUT"
          echo "vn=$VN" >> "$GITHUB_OUTPUT"

      # 앱 안 업데이트가 받은 APK 를 검증할 체크섬 (릴리스 본문에 적는다. 본문에 없으면 앱이 업데이트를 거부한다)
      - name: Compute APK checksum
        id: sum
        run: echo "sha=$(sha256sum /tmp/out/evergreen-release.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: evergreen-apk
          path: /tmp/out/*.apk
          if-no-files-found: error

      # 릴리스에 APK 를 직접 붙인다 (zip 압축 없이 바로 다운로드)
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Evergreen ${{ steps.ver.outputs.vn }} (build ${{ github.run_number }})
          body: |
            versionCode: ${{ steps.ver.outputs.vc }}
            versionName: ${{ steps.ver.outputs.vn }}
            sha256: ${{ steps.sum.outputs.sha }}
          make_latest: true
          files: /tmp/out/*.apk

      # 빌드와 릴리스가 모두 성공했을 때만, push 로 올라온 zip 을 저장소에서 지운다.
      # 실패하면 zip 이 남아 있어서 다시 시도할 수 있고, 수동 실행(workflow_dispatch)에서는 지우지 않는다.
      # 지우는 커밋은 GITHUB_TOKEN 으로 푸시되고 [skip ci] 도 붙어 있어서 워크플로가 다시 돌지 않는다.
      - name: Remove uploaded zip
        if: success() && github.event_name == 'push'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          git checkout -q -B "$BRANCH" "origin/$BRANCH"
          if ! git ls-files --error-unmatch -- "$ZIP_FILE" >/dev/null 2>&1; then
            echo "이미 없음: $ZIP_FILE"
            exit 0
          fi
          git rm -q -- "$ZIP_FILE"
          git commit -q -m "chore: remove $ZIP_FILE after build [skip ci]"
          git push origin "$BRANCH" || { git pull --rebase origin "$BRANCH" && git push origin "$BRANCH"; }
