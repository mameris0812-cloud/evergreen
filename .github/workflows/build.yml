
name: Build Evergreen APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP project if needed
        shell: bash
        run: |
          mkdir -p _source

          if ! find . -name settings.gradle.kts -o -name settings.gradle | grep -q .; then
            ZIP=$(find . -maxdepth 3 -name '*.zip' -not -path './.git/*' | head -n 1)

            if [ -z "$ZIP" ]; then
              echo "Project ZIP not found"
              exit 1
            fi

            unzip -o "$ZIP" -d _source
          fi

      - name: Locate Gradle project
        shell: bash
        run: |
          PROJECT=$(find . -type f \( \
            -name settings.gradle.kts -o \
            -name settings.gradle \
            \) -not -path './.git/*' | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "Gradle project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Copy APK to root
        run: |
          APK=$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi

          cp "$APK" ./Evergreen.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Evergreen-APK
          path: Evergreen.apk
          if-no-files-found: error
