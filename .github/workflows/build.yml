name: Build APK from ZIP

# 저장소 루트에 zip 파일을 그대로 올리면(push) 자동으로 압축을 풀고 APK를 빌드합니다.
on:
  push:
    branches: [main, master]
    paths:
      - "*.zip"
      - ".github/workflows/build-apk-from-zip.yml"
  workflow_dispatch:

# 새 실행이 시작되면 이전 대기/진행 중인 실행은 자동 취소 (큐가 쌓이는 것 방지)
concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        id: unzip
        run: |
          set -e
          # 최신 zip부터 보면서 settings.gradle(.kts)가 들어있는 "전체 프로젝트 zip"만 고른다
          ZIP=""
          for f in $(ls -t *.zip 2>/dev/null); do
            if unzip -Z1 "$f" | grep -qE '(^|/)settings\.gradle(\.kts)?$'; then
              ZIP="$f"; break
            fi
            echo "건너뜀(프로젝트 zip 아님): $f"
          done
          if [ -z "$ZIP" ]; then
            # 프로젝트 zip이 없음(삭제 커밋 등): 실패 처리하지 않고 나머지 단계를 건너뜀
            echo "빌드할 프로젝트 zip이 없어 건너뜁니다."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "Using: $ZIP"
          rm -rf project && mkdir project
          unzip -q "$ZIP" -d project

          # zip 안에 폴더가 한 겹 더 있는 경우(project/폴더명/...) 자동으로 올려줌
          if [ ! -f project/settings.gradle.kts ] && [ ! -f project/settings.gradle ]; then
            INNER=$(dirname "$(find project -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)")
            if [ -z "$INNER" ] || [ "$INNER" = "." ]; then
              echo "::error::zip 안에서 settings.gradle(.kts)를 찾지 못했습니다."
              exit 1
            fi
            mv "$INNER" project_inner
            rm -rf project
            mv project_inner project
          fi
          ls -la project

      - name: Set up JDK 17
        if: steps.unzip.outputs.found == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        if: steps.unzip.outputs.found == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        if: steps.unzip.outputs.found == 'true'
        working-directory: project
        run: gradle assembleDebug --stacktrace

      # APK를 폴더/zip 없이 파일 하나로 올리기 위해 이름을 고정해서 복사
      - name: Prepare debug APK
        if: steps.unzip.outputs.found == 'true'
        run: |
          mkdir -p out
          cp "$(ls project/app/build/outputs/apk/debug/*.apk | head -n 1)" out/evergreen-debug.apk

      - name: Upload debug APK
        if: steps.unzip.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: out/evergreen-debug.apk
          archive: false
          if-no-files-found: error

      # R8 최적화된 릴리스 APK (실패해도 디버그 APK에는 영향 없음)
      - name: Build release APK
        id: release
        if: steps.unzip.outputs.found == 'true'
        continue-on-error: true
        working-directory: project
        run: gradle assembleRelease --stacktrace

      - name: Prepare release APK
        if: steps.unzip.outputs.found == 'true' && steps.release.outcome == 'success'
        run: |
          mkdir -p out
          cp "$(ls project/app/build/outputs/apk/release/*.apk | head -n 1)" out/evergreen-release.apk

      - name: Upload release APK
        if: steps.unzip.outputs.found == 'true' && steps.release.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          path: out/evergreen-release.apk
          archive: false
          if-no-files-found: error
